    .progress-track {
    width: 100%;
    max-width: 350px;
    height: 8px;

    margin: 40px auto;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #007aff;
    border-radius: 999px;

}

@keyframes fillBar {
    from {
        width: 0%;
    }

    }
}

@media (prefers-color-scheme: dark) {

    }
}
